<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="A website about...">
  <!-- Link external CSS stylesheet at the top of any HTML file -->
  <link rel="stylesheet" href="styles.css">

  <!-- Google Fonts section: leave empty with fallback in CSS similar to Times New Roman -->
  <!-- <link href="" rel="stylesheet"> -->

  <!-- Title must have two parts in child-parent formation; last tag in head -->
  <title>Home | My Website</title>
</head>

<body>
  <!-- Wrap everything in body with #page-wrapper -->
  <div id="page-wrapper">

    <!-- Header starts here -->
    <header>
      <h1>Website Title</h1>
      <p><em>Subtitle</em></p>
      <!-- Button specifically labeled to change webpage theme from light to dark -->
      <button id="theme-toggle" type="button">Switch to Dark Mode</button>
    </header>
    <!-- Header ends here -->

    <!-- Wrap NAV and MAIN together in a single #container -->
    <div id="container">

      <!-- Navigation starts here -->
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="credits.html">Credits</a></li>
        </ul>
      </nav>
      <!-- Navigation ends here -->

      <!-- Main content starts here -->
      <main>
        <h1>Main Content Title</h1>

        <!-- At least 6 internal webpage sections; can be left blank -->
        <section id="section-1"><h2>Section 1</h2></section>
        <section id="section-2"><h2>Section 2</h2></section>
        <section id="section-3"><h2>Section 3</h2></section>
        <section id="section-4"><h2>Section 4</h2></section>
        <section id="section-5"><h2>Section 5</h2></section>
        <section id="section-6"><h2>Section 6</h2></section>
      </main>
      <!-- Main content ends here -->

    </div>
    <!-- #container ends here -->

    <!-- Footer starts here -->
    <footer>
      <p>All rights reserved: <a href="credits.html">Credits</a> &#169;</p>
    </footer>
    <!-- Footer ends here -->

  </div>
  <!-- #page-wrapper ends here -->

  <!-- Link external JavaScript file -->
  <script src="scripts.js"></script>
</body>
</html>
